spring.application.name=zenve_vet
server.port=8080

spring.config.import=optional:file:./local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/zenve_vet?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


app.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB


spring.jpa.open-in-view=false
